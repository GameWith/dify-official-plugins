settings:
  - name: app_token
    type: secret-input
    required: true
    label:
      en_US: App Token (Socket Mode)
      zh_Hans: App Token（Socket Mode）
      pt_BR: App Token (Socket Mode)
      ja_JP: App Token（Socket Mode）
    placeholder:
      en_US: Please input your App Token (starts with xapp-)
      zh_Hans: 请输入你的 App Token（以 xapp- 开头）
      pt_BR: Insira seu App Token (começa com xapp-)
      ja_JP: App Token を入力してください（xapp- で始まります）
  - name: bot_token
    type: secret-input
    required: true
    label:
      en_US: Bot Token
      zh_Hans: Bot Token
      pt_BR: Token do Bot
      ja_JP: Bot Token
    placeholder:
      en_US: Please input your Bot Token (starts with xoxb-)
      zh_Hans: 请输入你的 Bot Token（以 xoxb- 开头）
      pt_BR: Insira seu Bot Token (começa com xoxb-)
      ja_JP: Bot Token を入力してください（xoxb- で始まります）
  - name: app
    type: app-selector
    required: true
    label:
      en_US: App
      zh_Hans: 应用
      pt_BR: App
      ja_JP: アプリ
    placeholder:
      en_US: the app you want to use to answer Slack messages
      zh_Hans: 你想要用来回答 Slack 消息的应用
      pt_BR: o app que você deseja usar para responder mensagens do Slack
      ja_JP: あなたが Slack メッセージに回答するために使用するアプリ
endpoints:
  - endpoints/slack.yaml
  - endpoints/slack_invoke.yaml
